<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos on Trails — Editor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #map {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    #filmstrip-container {
      flex-shrink: 0;
    }

    .editor-status {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 16px;
      background: rgba(0, 0, 0, 0.7);
      font-size: 12px;
      color: #aaa;
      text-align: center;
      z-index: 900;
      pointer-events: none;
    }

    .editor-status--error {
      color: #f87171;
      background: rgba(127, 29, 29, 0.8);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="filmstrip-container"></div>
  </div>
  <script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
